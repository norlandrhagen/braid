<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>braid dashboard</title>
<link rel="preconnect" href="https://fonts.carbonplan.org">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
<style>
/* Tokens from @carbonplan/theme */
@font-face { font-family: 'relative-book-pro'; font-display: swap;
  src: url('https://fonts.carbonplan.org/relative/relative-book-pro.woff2') format('woff2'); }
@font-face { font-family: 'relative-medium-pro'; font-display: swap;
  src: url('https://fonts.carbonplan.org/relative/relative-medium-pro.woff2') format('woff2'); }
@font-face { font-family: 'relative-mono-11-pitch-pro'; font-display: swap;
  src: url('https://fonts.carbonplan.org/relative/relative-mono-11-pitch-pro.woff2') format('woff2'); }
:root {
  --text: #ebebec; --background: #1b1e23; --secondary: #808080;
  --muted: #393a3d; --hinted: #2a2c30;
  --red: #f07071; --orange: #ea9755; --yellow: #d4c05e; --green: #7eb36a;
  --teal: #64b9c4; --blue: #85a2f7; --purple: #bc85d9; --pink: #e587b6; --grey: #a9b4c4;
  --body: relative-book-pro, Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --heading: relative-medium-pro, Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: relative-mono-11-pitch-pro, ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --text: #1b1e23; --background: #ffffff; --muted: #b9b9bb; --hinted: #f2f2f1; }
}
:root[data-theme="light"] { --text: #1b1e23; --background: #ffffff; --muted: #b9b9bb; --hinted: #f2f2f1; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--background); color: var(--text);
  font-family: var(--body); letter-spacing: 0.01em; line-height: 1.35; font-size: 14px;
}
.caps { text-transform: uppercase; letter-spacing: 0.07em; font-family: var(--mono); font-size: 12px; color: var(--secondary); }
.mono { font-family: var(--mono); letter-spacing: 0.07em; }
button { font: inherit; color: var(--secondary); background: none; border: none; padding: 0; cursor: pointer; }
button:hover { color: var(--text); }
select {
  font: inherit; color: var(--text); background: var(--background); cursor: pointer;
  appearance: none; -webkit-appearance: none; border: none; border-bottom: 1px solid var(--text);
  border-radius: 0; padding: 0 4px 3px 0;
}
:focus-visible { outline: 1px solid var(--text); outline-offset: 2px; }
/* Tag: mono caps with underline; unselected at 1/3 opacity */
.tag {
  font-family: var(--mono); letter-spacing: 0.07em; text-transform: uppercase; font-size: 14px;
  color: var(--c, var(--text)); border-bottom: 1px solid var(--c, var(--text)); padding: 1px 0 2px;
}
button.tag { opacity: 0.33; }
button.tag:hover, button.tag.active { opacity: 1; color: var(--c, var(--text)); }
.btn { font-family: var(--mono); letter-spacing: 0.07em; text-transform: uppercase; font-size: 12px; }

header {
  display: flex; align-items: center; gap: 12px; padding: 16px 24px;
  border-bottom: 1px solid var(--muted);
}
header h1 { font-family: var(--heading); font-weight: 400; font-size: 24px; letter-spacing: -0.015em; margin: 0; }
header .spacer { flex: 1; }
header svg { width: 28px; height: 28px; fill: currentColor; }

.app { display: grid; grid-template-columns: 300px 1fr; height: calc(100% - 62px); }
nav { border-right: 1px solid var(--muted); overflow-y: auto; }
nav .row {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 10px; align-items: center;
  padding: 10px 24px; border-bottom: 1px solid var(--muted); cursor: pointer;
}
nav .row:hover { background: var(--hinted); }
nav .row.active { background: var(--hinted); box-shadow: inset 2px 0 0 var(--text); }
nav .row .name { grid-column: 2 / 4; color: var(--secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--c, var(--grey)); }
.s-SUCCEEDED { --c: var(--green); } .s-FAILED { --c: var(--red); }
.s-RUNNING { --c: var(--blue); } .s-STARTING, .s-RUNNABLE { --c: var(--yellow); }
.s-SUBMITTED, .s-PENDING { --c: var(--teal); }

main { overflow-y: auto; padding: 24px 32px 64px; }
.empty { color: var(--secondary); padding: 48px 0; }
.title { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.title h2 { font-family: var(--heading); font-weight: 400; font-size: 34px; letter-spacing: -0.015em; margin: 0; }
.stats { display: flex; gap: 32px; flex-wrap: wrap; margin: 20px 0 8px; }
.stats > div > div:last-child { font-family: var(--mono); font-size: 16px; margin-top: 4px; }
.reason { color: var(--red); margin-top: 8px; }

.tabs { display: flex; gap: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--muted); margin: 32px 0 8px; }

.panel { margin-top: 32px; }
.panel-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
.panel-head h3 { font-family: var(--heading); font-weight: 400; font-size: 18px; margin: 0; }
.panel-head .spacer { flex: 1; }
.panel-head .tag { font-size: 12px; }
.legend {
  display: flex; justify-content: center; gap: 20px; margin-top: 4px; font-size: 12px; color: var(--secondary);
  font-family: var(--mono); letter-spacing: 0.07em; text-transform: uppercase;
}
.legend span.v { font-family: var(--mono); color: var(--text); margin-left: 4px; }
.nodata { height: 180px; display: flex; align-items: center; justify-content: center; background: var(--hinted); color: var(--secondary); }

.u-select { background: color-mix(in srgb, var(--text) 10%, transparent); }
.uplot { font-family: var(--mono); }
.tip {
  position: absolute; display: none; pointer-events: none; z-index: 10; white-space: nowrap;
  background: var(--background); border: 1px solid var(--muted); border-radius: 1px;
  padding: 6px 10px; font-size: 12px; line-height: 1.6;
}
.tip b { font-family: var(--mono); font-weight: 400; margin-left: 4px; }

pre.logs {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em; background: var(--hinted);
  padding: 16px; border-radius: 1px; white-space: pre-wrap; word-break: break-word; max-height: 70vh; overflow-y: auto;
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; height: auto; }
  nav { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--muted); }
  main { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M21.9395,14.9395 L17.5005,19.3785 L17.5005,7.0005 L14.5005,7.0005 L14.5005,19.3785 L10.0605,14.9395 L7.9395,17.0605 L14.9395,24.0605 C15.2325,24.3535 15.6165,24.5005 16.0005,24.5005 C16.3835,24.5005 16.7675,24.3535 17.0605,24.0605 L24.0605,17.0605 L21.9395,14.9395 Z"/><path d="M27.5986,4 L22.8966,4 C26.5556,6.303 28.9996,10.366 28.9996,15 C28.9996,20.4 25.6896,25.039 20.9926,27 L26.5586,27 C29.8886,24.068 31.9996,19.785 31.9996,15 C31.9996,10.734 30.3196,6.868 27.5986,4"/><path d="M3,15 C3,10.366 5.444,6.303 9.104,4 L4.401,4 C1.68,6.868 0,10.734 0,15 C0,19.785 2.112,24.068 5.441,27 L11.008,27 C6.311,25.039 3,20.4 3,15"/></svg>
  <h1>braid</h1>
  <span class="caps">Batch jobs</span>
  <span class="spacer"></span>
  <span class="caps" id="updated"></span>
  <button class="btn" id="theme" title="Toggle light / dark"></button>
</header>
<div class="app">
  <nav id="jobs"></nav>
  <main id="main"><div class="empty">Select a job.</div></main>
</div>

<script>
const POLL_MS = 5000;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const fmtBytes = b => {
  if (b == null) return '-';
  const u = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
  let i = 0;
  while (Math.abs(b) >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(b < 10 && i ? 1 : 0)} ${u[i]}`;
};
const fmtDur = s => {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
};
const ago = ms => {
  const s = (Date.now() - ms) / 1000;
  return s < 60 ? `${s | 0}s ago` : s < 3600 ? `${s / 60 | 0}m ago` : s < 86400 ? `${s / 3600 | 0}h ago` : `${s / 86400 | 0}d ago`;
};
const api = async path => {
  const r = await fetch(path);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
};

// ---------- state ----------
const state = {
  jobs: [], sel: null, index: 0, tab: 'metrics',
  samples: [], job: null, netMode: 'total', xRange: null,
};
let charts = [];

// ---------- job list ----------
async function loadJobs() {
  try {
    state.jobs = await api('/api/jobs');
    $('#updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('#updated').textContent = 'error: ' + e.message;
    return;
  }
  $('#jobs').innerHTML = state.jobs.length ? state.jobs.map(j => `
    <div class="row ${j.batch_job_id === state.sel?.batch_job_id ? 'active' : ''}" data-id="${esc(j.batch_job_id)}">
      <span class="dot s-${esc(j.status)}"></span>
      <span class="mono">${esc(j.id)}</span>
      <span class="caps">${ago(j.created)}</span>
      <span class="name">${esc(j.name || j.status.toLowerCase())}${j.size > 1 ? ` · ${j.size} tasks` : ''}</span>
    </div>`).join('') : '<div class="empty" style="padding:24px">No braid jobs in the last ~7 days.</div>';
  for (const row of document.querySelectorAll('nav .row'))
    row.onclick = () => select(state.jobs.find(j => j.batch_job_id === row.dataset.id));
}

function select(j) {
  state.sel = j; state.index = 0; state.samples = []; state.job = null; state.xRange = null;
  history.replaceState(null, '', '#' + j.batch_job_id);
  document.querySelectorAll('nav .row').forEach(r => r.classList.toggle('active', r.dataset.id === j.batch_job_id));
  renderShell();
  loadJob();
}

const taskId = () => state.sel.size > 1 ? `${state.sel.batch_job_id}:${state.index}` : state.sel.batch_job_id;
const finished = s => s === 'SUCCEEDED' || s === 'FAILED';

// ---------- job detail ----------
function renderShell() {
  const j = state.sel;
  $('#main').innerHTML = `
    <div class="title">
      <h2>${esc(j.name || j.id)}</h2>
      <span class="mono" style="color:var(--secondary)">${esc(j.id)}</span>
      ${j.size > 1 ? `<label class="caps">Task <select id="index">${
        Array.from({ length: j.size }, (_, i) => `<option value="${i}">${i}</option>`).join('')}</select></label>` : ''}
    </div>
    <div class="stats" id="stats"></div>
    <div id="reason" class="reason"></div>
    <div class="tabs">
      <button class="tag" data-tab="metrics">Metrics</button>
      <button class="tag" data-tab="logs">Logs</button>
    </div>
    <div id="tab"></div>`;
  const idx = $('#index');
  if (idx) idx.onchange = () => { state.index = +idx.value; state.samples = []; state.xRange = null; renderTab(); loadJob(); };
  for (const b of document.querySelectorAll('.tabs button'))
    b.onclick = () => { state.tab = b.dataset.tab; renderTab(); if (state.tab === 'logs') loadLogs(); };
  renderTab();
}

function renderStats() {
  const j = state.job;
  if (!j) return;
  const summary = Object.entries(j.array_summary || {}).filter(([, n]) => n).map(([k, n]) => `${n} ${k.toLowerCase()}`).join(', ');
  const stat = (k, v) => `<div><div class="caps">${k}</div><div>${esc(v)}</div></div>`;
  $('#stats').innerHTML = [
    `<div><div class="caps">Status</div><div><span class="tag s-${esc(j.status)}">${esc(j.status)}</span></div></div>`,
    stat('vCPU', j.vcpu || '-'),
    stat('Memory', j.mem_mb ? fmtBytes(j.mem_mb * 2 ** 20) : '-'),
    stat('Disk', state.samples.length ? fmtBytes(state.samples.at(-1).disk_limit) : '-'),
    stat('Elapsed', j.started ? fmtDur(j.elapsed_s) : 'not started'),
    stat('Cost est', j.cost),
    summary ? stat('Tasks', summary) : '',
  ].join('');
  $('#reason').textContent = j.status === 'FAILED' ? j.reason : '';
}

function renderTab() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  charts.forEach(c => c.u?.destroy());
  charts = [];
  if (state.tab === 'logs') { $('#tab').innerHTML = '<pre class="logs" id="logs">Loading...</pre>'; return; }
  $('#tab').innerHTML = PANELS.map(p => `
    <section class="panel" id="p-${p.key}">
      <div class="panel-head">
        <h3>${p.title}</h3>
        ${p.key === 'net' ? ['total', 'rate'].map(m => `<button class="tag ${state.netMode === m ? 'active' : ''}" data-net="${m}">${m}</button>`).join('') : ''}
        <span class="spacer"></span>
        <span class="caps">Drag to zoom</span>
        <button class="btn" data-act="out">Zoom out</button>
        <button class="btn" data-act="reset">Reset</button>
      </div>
      <div class="chart"></div>
      <div class="legend"></div>
    </section>`).join('');
  for (const b of document.querySelectorAll('[data-net]'))
    b.onclick = () => { state.netMode = b.dataset.net; renderTab(); };
  for (const b of document.querySelectorAll('[data-act]'))
    b.onclick = () => b.dataset.act === 'reset' ? setX(null) : zoomOut();
  drawCharts();
}

// ---------- charts ----------
const pct = v => v == null ? '-' : `${Math.round(v)}%`;
const PANELS = [
  {
    key: 'cpu', title: 'CPU', fmt: pct,
    series: [
      { label: 'used', color: 'blue', fill: true, get: s => s.cpu },
      { label: 'limit', color: 'secondary', dash: true, get: s => s.cpu_limit },
    ],
  },
  {
    key: 'mem', title: 'Memory', fmt: fmtBytes,
    series: [
      { label: 'used', color: 'purple', fill: true, get: s => s.mem },
      { label: 'limit', color: 'secondary', dash: true, get: s => s.mem_limit },
    ],
  },
  {
    key: 'net', title: 'Network', fmt: v => state.netMode === 'rate' ? (v == null ? '-' : fmtBytes(v) + '/s') : fmtBytes(v),
    series: [
      { label: 'sent', color: 'pink', fill: true, get: s => s.tx, rate: true },
      { label: 'received', color: 'green', fill: true, get: s => s.rx, rate: true },
    ],
  },
  {
    key: 'disk', title: 'Disk', fmt: fmtBytes,
    series: [
      { label: 'used', color: 'teal', fill: true, get: s => s.disk },
      { label: 'reserved', color: 'secondary', dash: true, get: s => s.disk_limit },
    ],
  },
];

function panelData(p) {
  const S = state.samples;
  const xs = S.map(s => s.t);
  const ys = p.series.map(se => {
    const v = S.map(se.get);
    if (!(se.rate && state.netMode === 'rate')) return v;
    return v.map((x, i) => i ? Math.max(0, (x - v[i - 1]) / (xs[i] - xs[i - 1])) : null);
  });
  return [xs, ...ys];
}

let syncing = false;
function setX(range) {
  state.xRange = range;
  syncing = true;
  for (const c of charts) {
    if (!c.u) continue;
    const xs = c.u.data[0];
    c.u.setScale('x', range || { min: xs[0], max: xs.at(-1) });
  }
  syncing = false;
}
function zoomOut() {
  const xs = state.samples.map(s => s.t);
  if (!state.xRange || !xs.length) return;
  const { min, max } = state.xRange, w = max - min;
  const r = { min: Math.max(xs[0], min - w / 2), max: Math.min(xs.at(-1), max + w / 2) };
  setX(r.min <= xs[0] && r.max >= xs.at(-1) ? null : r);
}

function drawCharts() {
  for (const p of PANELS) {
    const sec = $(`#p-${p.key}`), el = $('.chart', sec), leg = $('.legend', sec);
    leg.innerHTML = p.series.map(se => `<span><span class="dot" style="background:${css('--' + se.color)}"></span> ${se.label}<span class="v"></span></span>`).join('');
    if (!window.uPlot) {
      el.innerHTML = '<div class="nodata">Chart library failed to load (offline?). Latest: ' + (state.samples.length ? p.series.map(se => `${se.label} ${esc(p.fmt(se.get(state.samples.at(-1))))}`).join(', ') : 'no samples') + '</div>';
      charts.push({ p, el, leg });
      continue;
    }
    if (state.samples.length < 2) {
      el.innerHTML = `<div class="nodata">${state.job && !state.job.has_stream ? 'Waiting for the task to start' : 'No metrics yet (samples every 5s)'}</div>`;
      charts.push({ p, el, leg });
      continue;
    }
    const axis = {
      stroke: css('--secondary'), font: `12px ${css('--mono')}`,
      grid: { stroke: css('--muted') + '99', width: 1 }, ticks: { show: false },
      border: { show: true, stroke: css('--secondary'), width: 1 },
    };
    const u = new uPlot({
      width: el.clientWidth, height: 180,
      legend: { show: false },
      cursor: { sync: { key: 'braid' }, drag: { x: true, y: false } },
      scales: { y: { range: (u, min, max) => [0, max > 0 ? max * 1.08 : 1] } },
      axes: [{ ...axis, size: 32, space: 90, values: (u, v) => v.map(t => new Date(t * 1000).toLocaleTimeString([], { hour12: false })) }, { ...axis, size: 70, values: (u, v) => v.map(p.fmt) }],
      series: [{}, ...p.series.map(se => ({
        label: se.label, stroke: css('--' + se.color), width: se.dash ? 1 : 1.5,
        dash: se.dash ? [4, 4] : undefined, points: { show: false }, cap: 'round', join: 'round',
        fill: se.fill ? css('--' + se.color) + '33' : undefined,
      }))],
      hooks: {
        setScale: [(u, key) => {
          if (key !== 'x' || syncing) return;
          const xs = u.data[0];
          const { min, max } = u.scales.x;
          if (min > xs[0] || max < xs.at(-1)) setX({ min, max });
        }],
        setCursor: [u => {
          const idx = u.cursor.idx, i = idx ?? u.data[0].length - 1;
          leg.querySelectorAll('.v').forEach((el, k) => el.textContent = p.fmt(u.data[k + 1][i]));
          const tip = u.over.querySelector('.tip');
          if (idx == null) { tip.style.display = 'none'; return; }
          tip.innerHTML = `<div class="caps">${new Date(u.data[0][idx] * 1000).toLocaleTimeString([], { hour12: false })}</div>` +
            p.series.map((se, k) => `<div><span class="dot" style="background:${css('--' + se.color)}"></span> ${se.label} <b>${p.fmt(u.data[k + 1][idx])}</b></div>`).join('');
          tip.style.display = 'block';
          const x = u.cursor.left, flip = x > u.over.clientWidth - tip.offsetWidth - 16;
          tip.style.left = `${flip ? x - tip.offsetWidth - 12 : x + 12}px`;
          tip.style.top = `${Math.max(0, Math.min(u.cursor.top - tip.offsetHeight / 2, u.over.clientHeight - tip.offsetHeight))}px`;
        }],
      },
    }, panelData(p), el);
    u.over.insertAdjacentHTML('beforeend', '<div class="tip"></div>');
    charts.push({ p, el, leg, u });
  }
  updateLegends();
  if (state.xRange) setX(state.xRange);
}

function updateLegends() {
  for (const c of charts) {
    if (!c.u) continue;
    const i = c.u.data[0].length - 1;
    c.leg.querySelectorAll('.v').forEach((el, k) => el.textContent = c.p.fmt(c.u.data[k + 1][i]));
  }
}

function updateCharts() {
  if (state.tab !== 'metrics') return;
  if (charts.some(c => !c.u) && state.samples.length >= 2) { renderTab(); return; }
  syncing = true;
  for (const c of charts) c.u?.setData(panelData(c.p), !state.xRange);
  syncing = false;
  if (state.xRange) setX(state.xRange);
  updateLegends();
}

new ResizeObserver(() => charts.forEach(c => c.u?.setSize({ width: c.el.clientWidth, height: 180 }))).observe(document.body);

// ---------- polling ----------
async function loadJob() {
  if (!state.sel) return;
  const id = taskId();
  const since = state.samples.length ? Math.floor(state.samples.at(-1).t * 1000) + 1 : 0;
  let r;
  try { r = await api(`/api/job?id=${encodeURIComponent(id)}&since=${since}`); }
  catch (e) { $('#stats').textContent = 'error: ' + e.message; return; }
  if (id !== taskId()) return; // selection changed mid-request
  const hadStream = state.job?.has_stream;
  state.job = r.job;
  // Overlapping polls can return the same samples; dedupe by time and keep sorted.
  const seen = new Set(state.samples.map(s => s.t));
  state.samples.push(...r.samples.filter(s => !seen.has(s.t)));
  state.samples.sort((a, b) => a.t - b.t);
  renderStats();
  if (r.samples.length || hadStream !== r.job.has_stream) updateCharts();
}

async function loadLogs() {
  if (!state.sel || state.tab !== 'logs') return;
  const pre = $('#logs');
  try {
    const lines = await api(`/api/logs?id=${encodeURIComponent(taskId())}`);
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
    pre.textContent = lines.length ? lines.map(l => `${new Date(l.t).toLocaleTimeString()}  ${l.message}`).join('\n') : 'No logs yet.';
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch (e) { pre.textContent = 'error: ' + e.message; }
}

async function tick() {
  await loadJobs();
  if (state.sel && !(state.job && finished(state.job.status))) await loadJob();
  if (state.sel && state.tab === 'logs' && !(state.job && finished(state.job.status))) await loadLogs();
}

function setTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  const dark = css('--background') === '#1b1e23';
  $('#theme').textContent = dark ? 'Light' : 'Dark';
  if (state.sel && state.tab === 'metrics') renderTab(); // charts read colors at draw time
}
$('#theme').onclick = () => {
  const t = css('--background') === '#1b1e23' ? 'light' : 'dark';
  try { localStorage.setItem('braid-theme', t); } catch {}
  setTheme(t);
};
try { setTheme(localStorage.getItem('braid-theme')); } catch { setTheme(null); }

(async () => {
  await loadJobs();
  const pre = state.jobs.find(j => j.batch_job_id === location.hash.slice(1));
  if (pre) select(pre);
  setInterval(tick, POLL_MS);
})();
</script>
</body>
</html>
